---
name: Fedora

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      DESTDIR: ./out
      # the wrap filter refuses to run in a non-UTF-8 locale
      LANG: C.UTF-8
    steps:
      # git must be installed before checkout, or it falls back to a
      # tarball with no history and git describe can't stamp the version
      - run: dnf install -y --setopt=install_weak_deps=False git make gcc golang scdoc diffutils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the workspace belongs to the runner user, not the container's root
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make
      - run: make tests
      - run: make install
      - run: make checkinstall
      - run: ./aerc -v
      - uses: actions/upload-artifact@v7
        with:
          name: aerc-fedora43-x86_64
          path: out/
